    function TypeWriter({ phrases }) {
      const [display, setDisplay] = useState("");
      const [phrase,  setPhrase]  = useState(0);
      const [pos,     setPos]     = useState(0);
      const [erasing, setErasing] = useState(false);

      useEffect(() => {
        const current = phrases[phrase];
        let t;
        if (!erasing && pos < current.length) {
          t = setTimeout(() => setPos(p => p + 1), 75);
        } else if (!erasing && pos === current.length) {
          t = setTimeout(() => setErasing(true), 2200);
        } else if (erasing && pos > 0) {
          t = setTimeout(() => setPos(p => p - 1), 35);
        } else {
          setErasing(false);
          setPhrase(i => (i + 1) % phrases.length);
        }
        setDisplay(current.slice(0, pos));
        return () => clearTimeout(t);
      }, [pos, erasing, phrase]);

      return <span className="mono text-violet-400 cursor">{display}</span>;
    }

    function useBlogRoute() {
      const getSlug = () => {
        const m = window.location.hash.match(/^#\/blogs\/(.+)$/);
        return m ? m[1] : null;
      };
      const [slug, setSlug] = useState(getSlug);
      useEffect(() => {
        const onChange = () => setSlug(getSlug());
        window.addEventListener("hashchange", onChange);
        return () => window.removeEventListener("hashchange", onChange);
      }, []);
      return slug;
    }

    function BlogPost({ slug }) {

      const [error, setError] = useState(null);

      useEffect(() => {
        setHtml(null);
        setNotFound(false);
        setError(null);
        const base = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
        const url = `${base}blogs/${slug}.md`;
        fetch(url)
          .then(r => {
            if (r.status === 404) { setNotFound(true); return null; }
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
            return r.text();
          })
          .then(text => {
            if (text === null) return;
            const parser = window.marked.parse || window.marked;

          .catch(e => setError(e.message));

              </div>
            )}
